name: Phase 1 foundation
on: [push, pull_request]
permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make env
      - name: Validate Compose and credential-file metadata
        run: |
          docker compose --env-file .env -f infra/compose.yaml config --quiet
          stat -c 'S3 source permissions: %u:%g %a' .local/seaweedfs.json
      - run: make up
      - run: make database-check
      - run: make migrate seed
      - run: make backend-check frontend-check infra-check outage-check
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Capture redacted diagnostics before cleanup
        if: failure()
        run: node infra/scripts/diagnose-compose.mjs
      - if: always()
        run: make down
