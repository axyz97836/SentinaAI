name: sentinelai-db-tests
services:
  database-test:
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    env_file: ../.local/database-tests.env
    # RAM-backed disposable data; no main development volume is referenced.
    tmpfs: [/var/lib/postgresql/data]
    networks: [test]
    healthcheck:
      # Do not release provisioning while the temporary init server is running.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
  redis-test:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    env_file: ../.local/database-tests.env
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\nmaxmemory 64mb\nmaxmemory-policy noeviction\nsave ""\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  database-checks:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: test
    env_file: ../.local/database-tests.env
    environment:
      DB_HOST: database-test
      APP_ENV: test
      DATABASE_TESTS: "1"
      REDIS_HOST: redis-test
    networks: [test]
    command: [pytest, -p, no:cacheprovider, tests/database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
networks:
  test:
    internal: true
