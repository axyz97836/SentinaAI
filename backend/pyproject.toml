[project]
name = "sentinelai-backend"
version = "0.1.0"
description = "SentinelAI local foundation; synthetic data only."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["database: requires the guarded disposable PostgreSQL test service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Column inventories mirror the approved document's rows for review.
"tests/database/schema_contract.py" = ["E501"]
# Frozen SQL keeps each constraint readable as one expression; all other lint rules apply.
"migrations/versions/*" = ["E501"]
# This copied script is an executable integration test, not application code.
"check_infra.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "sklearn", "sklearn.*", "threadpoolctl", "shap", "shap.*"]
ignore_missing_imports = true
